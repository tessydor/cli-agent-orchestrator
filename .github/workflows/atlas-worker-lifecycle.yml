name: Atlas worker lifecycle
on:
  pull_request:
    branches: [maintenance/2.4.1-atlas]
  push:
    branches: [codex/claude-worker-failure-recovery-v1]
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }} --group dev
      - name: Regression checks with isolated state
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          export CAO_HOME_DIR="$(mktemp -d)"
          uv run --no-sync python -m pytest -p pytest_asyncio.plugin -p pytest_mock -p pytest_cov --no-cov -q \
            test/services/test_claude_completion_launcher.py \
            test/providers/test_claude_code_completion_adapter_unit.py \
            test/services/test_assigned_worker_completion_service.py \
            test/services/test_inbox_service.py \
            test/services/test_terminal_service_inbox_registration.py \
            test/services/test_claude_completion_adapter.py \
            test/services/test_provider_completion_report.py \
            test/providers/test_status_staleness_guard.py \
            test/providers/test_claude_code_unit.py \
            test/providers/test_claude_code_coverage.py
